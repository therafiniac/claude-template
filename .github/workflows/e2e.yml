name: E2E
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Detect test:e2e script
        id: detect
        run: |
          if [ -f package.json ] && jq -e '.scripts["test:e2e"]' package.json >/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No test:e2e script. Skipping."
          fi
      - if: steps.detect.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.detect.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.detect.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.enabled == 'true'
        run: '[ -f .env.example ] && cp .env.example .env || true'
      - if: steps.detect.outputs.enabled == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.detect.outputs.enabled == 'true'
        run: pnpm build
      - if: steps.detect.outputs.enabled == 'true'
        run: pnpm test:e2e
